ا عند الاستلام أو بتحويل CliQ من تطبيق البنك. لا يطلب الموقع ولا يحفظ أي بيانات بطاقات أو حسابات بنكية.",en:"Payment is cash on delivery or a CliQ transfer from your banking app. The site never asks for or stores card or bank account details."}]},{h:{ar:"ملفات تعريف الارتباط والتخزين في المتصفح",en:"Cookies and browser storage"},p:[{ar:"نستخدم ملف تعريف ارتباط واحدًا ضروريًا لإبقائك مسجّل الدخول (عند استخدام الحساب). ويحفظ متصفحك محليًا: اللغة المختارة، محتوى السلة، والمفضّلة قبل تسجيل الدخول. لا نستخدم أدوات تتبّع أو تحليلات أو إعلانات.",en:"We use one essential cookie to keep you signed in (when you use an account). Your browser also keeps, locally: your chosen language, your bag, and favourites before you sign in. We use no tracking, analytics or advertising tools."}]},{h:{ar:"مع من نشارك البيانات",en:"Who we share data with"},p:[{ar:"لا نبيع بياناتك. تُعالج البيانات لدى:",en:"We never sell your data. It is processed by:"}],list:[{ar:"Cloudflare، الشركة التي تستضيف الموقع وقاعدة بياناته.",en:"Cloudflare, which hosts the site and its database."},{ar:"خدمة إرسال البريد التي تُبلغ المحل بالطلبات الجديدة وترسل روابط استعادة كلمة السر.",en:"The email service that notifies the shop of new orders and sends password-reset links."},{ar:"خطوط Google Fonts التي يحمّلها متصفحك من خوادم Google لعرض النصوص.",en:"Google Fonts, which your browser loads from Google’s servers to display text."},{ar:"فريق التوصيل، الذي يحصل على اسم المستلم ورقمه وعنوانه فقط.",en:"Our delivery team, who receive only the recipient’s name, mobile and address."}]},{h:{ar:"مدة الاحتفاظ",en:"How long we keep it"},p:[{ar:"نحتفظ بالطلبات للمدة اللازمة لتنفيذها ولمتطلبات المحاسبة. يمكنك حذف حسابك بطلب منّا، وعندها تُفصل طلباتك السابقة عنه.",en:"We keep orders for as long as needed to fulfil them and for accounting. You can ask us to delete your account; your past orders are then unlinked from it."}]},{h:{ar:"حقوقك",en:"Your rights"},p:[{ar:"يحق لك الاطلاع على بياناتك وتصحيحها وطلب حذفها وسحب موافقتك. تواصل  special"},from:{ar:"من",en:"From"},sender:{ar:"اسمك",en:"Your name"},anonymous:{ar:"لن يظهر اسم المرسِل على البطاقة.",en:"The sender’s name will be left off the card."},note:{ar:"معاينة للكلمات؛ قد يختلف شكل البطاقة النهائية.",en:"A preview of your words; the final card layout may vary."},applied:{ar:"أُضيفت الرسالة. يمكنك تعديلها كما تحب.",en:"Message added. You can edit it to make it yours."},limit:{ar:"عدد الأحرف",en:"Character count"}},Ag=["birthday","romance","graduation","thankyou","justbecause"],ff=[{id:"birthday-1",occasion:"birthday",text:{ar:"كل عام وأنت بخير. أتمنى أن يحمل لك عامك الجديد فرحاً يشبه جمال قلبك، وأياماً تزهر بكل ما تحب.",en:"Happy birthday! May your new year bring the joy you give to others, and days that bloom with everything you love."}},{id:"birthday-2",occasion:"birthday",text:{ar:"في يوم ميلادك، هذه الزهور لك، ومعها أمنيات بسعادة تليق بك وأحلام تتحقق. كل عام وأنت بألف خير.",en:"Flowers for your birthday, with wishes for happiness that feels like you and dreams coming true. Have a wonderful day."}},{id:"romance-1",occasion:"romance",text:{ar:"معك تصبح التفاصيل الصغيرة أجمل، والأيام العادية حكاية تستحق أن تُروى. هذه الزهور تقول بعض ما في قلبي لك.",en:"With you, the little things feel beautiful and ordinary days become memories. These flowers say a little of what is in my heart."}},{id:"romance-2",occasion:"romance",text:{ar:"لك، لأن وجودك يملأ أيامي حباً. ولنا، ولكل اللحظات الجميلة التي عشناها والتي تنتظرنا.",en:"For you, for the love you bring to my days. For us, and for all the beautiful moments behind us and still to come."}},{id:"graduation-1",occasion:"graduation",text:{ar:"مبارك التخرّج! خلف هذا النجاح تعب وإصرار يستحقان الاحتفال. فخورون بك، ونتمنى لك بداية تزهر بالفرص الجميلة.",en:"Congratulations, graduate! Your hard work and determination deserve to be celebrated. So proud of you and excited for all that comes next."}},{id:"graduation-2",occasion:"graduation",text:{ar:"اليوم تحتفل بثمرة جهدك، وغداً تبدأ حكاية جديدة. مبارك تخرّجك
