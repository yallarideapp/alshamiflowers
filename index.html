:{ar:"البيانات التي نجمعها",en:"What we collect"},p:[{ar:"نجمع فقط ما يلزم لتنفيذ طلبك:",en:"Only what we need to fulfil your order:"}],list:[{ar:"عند الطلب: اسمك ورقم موبايلك وبريدك (اختياري)، اسم المستلم ورقمه، المحافظة والعنوان، تاريخ ووقت التوصيل، رسالة البطاقة والملاحظات، وكود الخصم إن وُجد.",en:"When you order: your name, mobile and email (optional), the recipient’s name and mobile, governorate and address, delivery date and time, card message and notes, and any discount code."},{ar:"عند إنشاء حساب: الاسم والبريد ورقم الموبايل (اختياري) وكلمة السر (تُحفظ مشفّرة ولا يمكن قراءتها)، والعنوان المحفوظ والمفضّلة إن اخترت حفظها.",en:"When you create an account: name, email, mobile (optional) and password (stored as a one-way hash), plus a saved address and favourites if you choose."},{ar:"لحماية الموقع من الإساءة: بصمة مشفّرة لعنوان IP تُستخدم لحدّ عدد المحاولات، وتُحذف تلقائيًا خلال يومين.",en:"To protect the site from abuse: a hashed fingerprint of your IP address used to limit repeated attempts, deleted automatically within two days."}]},{h:{ar:"الدفع",en:"Payment"},p:[{ar:"الدفع نقدًا عند الاستلام أو بتحويل CliQ من تطبيق البنك. لا يطلب الموقع ولا يحفظ أي بيانات بطاقات أو حسابات بنكية.",en:"Payment is cash on delivery or a CliQ transfer from your banking app. The site never asks for or stores card or bank account details."}]},{h:{ar:"ملفات تعريف الارتباط والتخزين في المتصفح",en:"Cookies and browser storage"},p:[{ar:"نستخدم ملف تعريف ارتباط واحدًا ضروريًا لإبقائك مسجّل الدخول (عند استخدام الحساب). ويحفظ متصفحك محليًا: اللغة المختارة، محتوى السلة، والمفضّلة قبل تسجيل الدخول. لا نستخدم أدوات تتبّع أو تحليلات أو إعلانات.",en:"We use one essential cookie to keep you signed in (when you use an account). Your browser also keeps, locally: your chosen language, your bag, and favourites before you sign in. We use no tracking, analytics or advertising tools."}]},{h:{ar:"مع من نشارك البيانات",en:"Who we share data with"},p:[{ar:"لا نبيع بياناتك. تُعالج البيانات لدى:",en:"We n
