 عند الاستلام أو بتحويل CliQ من تطبيق البنك. لا يطلب الموقع ولا يحفظ أي بيانات بطاقات أو حسابات بنكية.",en:"Payment is cash on delivery or a CliQ transfer from your banking app. The site never asks for or stores card or bank account details."}]},{h:{ar:"ملفات تعريف الارتباط والتخزين في المتصفح",en:"Cookies and browser storage"},p:[{ar:"نستخدم ملف تعريف ارتباط واحدًا ضروريًا لإبقائك مسجّل الدخول (عند استخدام الحساب). ويحفظ متصفحك محليًا: اللغة المختارة، محتوى السلة، والمفضّلة قبل تسجيل الدخول. لا نستخدم أدوات تتبّع أو تحليلات أو إعلانات.",en:"We use one essential cookie to keep you signed in (when you use an account). Your browser also keeps, locally: your chosen language, your bag, and favourites before you sign in. We use no tracking, analytics or advertising tools."}]},{h:{ar:"مع من نشارك البيانات",en:"Who we share data with"},p:[{ar:"لا نبيع بياناتك. تُعالج البيانات لدى:",en:"We never sell your data. It is processed by:"}],list:[{ar:"Cloudflare، الشركة التي تستضيف الموقع وقاعدة بياناته.",en:"Cloudflare, which hosts the site and its database."},{ar:"خدمة إرسال البريد التي تُبلغ المحل بالطلبات الجديدة وترسل روابط استعادة كلمة السر.",en:"The email service that notifies the shop of new orders and sends password-reset links."},{ar:"خطوط Google Fonts التي يحمّلها متصفحك من خوادم Google لعرض النصوص.",en:"Google Fonts, which your browser loads from Google’s servers to display text."},{ar:"فريق التوصيل، الذي يحصل على اسم المستلم ورقمه وعنوانه فقط.",en:"Our delivery team, who receive only the recipient’s name, mobile and address."}]},{h:{ar:"مدة الاحتفاظ",en:"How long we keep it"},p:[{ar:"نحتفظ بالطلبات للمدة اللازمة لتنفيذها ولمتطلبات المحاسبة. يمكنك حذف حسابك بطلب منّا، وعندها تُفصل طلباتك السابقة عنه.",en:"We keep orders for as long as needed to fulfil them and for accounting. You can ask us to delete your account; your past orders are then unlinked from it."}]},{h:{ar:"حقوقك",en:"Your rights"},p:[{ar:"يحق لك الاطلاع على بياناتك وتصحيحها وطلب حذفها وسحب موافقتك. تواصل معنا عبر الهاتف أو إنستغرام. ويحق لك تقديم شكوى إلى وحدة حماية البيانات الشخصية في وزارة الاقتصاد الرقمي والريادة.",en:"You may access, correct or ask us to delete your data, and withdraw your consent. Contact us by phone or Instagram. You may also complain to the Personal Data Protection Unit at the Ministry of Digital Economy and Entrepreneurship."}]}]},mg={title:{ar:"الشروط والأحكام",en:"Terms & Conditions"},intro:{ar:"باستخدامك موقع أزهار الشامي وتقديم طلب من خلاله، فإنك توافق على الشروط التالية.",en:"By using the Al-Shami Flowers website and placing an order, you agree to the following terms."},sections:[{h:{ar:"المنتجات والصور",en:"Products and photos"},p:[{ar:"الصور من أعمال المحل الحقيقية وهي للتوضيح. كل تصميم يُجهَّز عند الطلب، وقد يختلف نوع الورد أو لونه قليلًا حسب الموسم والتوفّر، مع الحفاظ على روح التصميم وقيمته.",en:"Photos show the shop’s real work and are illustrative. Every design is made to order, and flowers or shades may vary slightly with the season and availability, keeping the design’s spirit and value."}]},{h:{ar:"الأسعار",en:"Prices"},p:[{ar:"الأسعار بالدينار الأردني. تُحسب رسوم التوصيل حسب المحافظة وتظهر قبل تأكيد الطلب.",en:"Prices are in Jordanian dinars. Delivery fees depend on the governorate and are shown before you place the order."}]},{h:{ar:"الطلب والتأكيد",en:"Orders and confirmation"},p:[{ar:"الطلب المُرسل من الموقع هو طلب شراء، ويصبح مؤكَّدًا بعد اتصال المحل بك. يحق للمحل الاعتذار عن طلب لا يمكن تنفيذه، وسيبلغك بذلك.",en:"An order sent from the site is a purchase request; it is confirmed once the shop calls you. The shop may decline an order it cannot fulfil and will tell you if so."}]},{h:{ar:"الدفع",en:"Payment"},p:[{ar:"الدفع نقدًا عند الاستلام أو بتحويل CliQ إلى اسم CliQ الظاهر للمحل. في طلبات CliQ يبدأ تجهيز الطلب بعد وصول الحوالة.",en:"Payment is cash on delivery or a CliQ transfer to the shop’s alias shown on the site. For CliQ orders, preparation starts once the transfer arrives."}]},{h:{ar:"التوصيل",en:"Delivery"},p:[{ar:"
