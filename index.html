ح هذه السياسة البيانات التي يجمعها موقع أزهار الشامي، ولماذا، وكيف نحميها. نطبّق قانون حماية البيانات الشخصية الأردني رقم 24 لسنة 2023.",en:"This policy explains what data the Al-Shami Flowers website collects, why, and how we protect it. We follow Jordan’s Personal Data Protection Law No. 24 of 2023."},sections:[{h:{ar:"البيانات التي نجمعها",en:"What we collect"},p:[{ar:"نجمع فقط ما يلزم لتنفيذ طلبك:",en:"Only what we need to fulfil your order:"}],list:[{ar:"عند الطلب: اسمك ورقم موبايلك وبريدك (اختياري)، اسم المستلم ورقمه، المحافظة والعنوان، تاريخ ووقت التوصيل، رسالة البطاقة والملاحظات، وكود الخصم إن وُجد.",en:"When you order: your name, mobile and email (optional), the recipient’s name and mobile, governorate and address, delivery date and time, card message and notes, and any discount code."},{ar:"عند إنشاء حساب: الاسم والبريد ورقم الموبايل (اختياري) وكلمة السر (تُحفظ مشفّرة ولا يمكن قراءتها)، والعنوان المحفوظ والمفضّلة إن اخترت حفظها.",en:"When you create an account: name, email, mobile (optional) and password (stored as a one-way hash), plus a saved address and favourites if you choose."},{ar:"لحماية الموقع من الإساءة: بصمة مشفّرة لعنوان IP تُستخدم لحدّ عدد المحاولات، وتُحذف تلقائيًا خلال يومين.",en:"To protect the site from abuse: a hashed fingerprint of your IP address used to limit repeated attempts, deleted automatically within two days."}]},{h:{ar:"الدفع",en:"Payment"},p:[{ar:"الدفع نقدًا عند الاستلام أو بتحويل CliQ من تطبيق البنك. لا يطلب الموقع ولا يحفظ أي بيانات بطاقات أو حسابات بنكية.",en:"Payment is cash on delivery or a CliQ transfer from your banking app. The site never asks for or stores card or bank account details."}]},{h:{ar:"ملفات تعريف الارتباط والتخزين في المتصفح",en:"Cookies and browser storage"},p:[{ar:"نستخدم ملف تعريف ارتباط واحدًا ضروريًا لإبقائك مسجّل الدخول (عند استخدام الحساب). ويحفظ متصفحك محليًا: اللغة المختارة، محتوى السلة، والمفضّلة قبل تسجيل الدخول. لا نستخدم أدوات تتبّع أو تحليلات أو إعلانات.",en:"We use one essential cookie to  to the following terms."},sections:[{h:{ar:"المنتجات والصور",en:"Products and photos"},p:[{ar:"الصور من أعمال المحل الحقيقية وهي للتوضيح. كل تصميم يُجهَّز عند الطلب، وقد يختلف نوع الورد أو لونه قليلًا حسب الموسم والتوفّر، مع الحفاظ على روح التصميم وقيمته.",en:"Photos show the shop’s real work and are illustrative. Every design is made to order, and flowers or shades may vary slightly with the season and availability, keeping the design’s spirit and value."}]},{h:{ar:"الأسعار",en:"Prices"},p:[{ar:"الأسعار بالدينار الأردني. تُحسب رسوم التوصيل حسب المحافظة وتظهر قبل تأكيد الطلب.",en:"Prices are in Jordanian dinars. Delivery fees depend on the governorate and are shown before you place the order."}]},{h:{ar:"الطلب والتأكيد",en:"Orders and confirmation"},p:[{ar:"الطلب المُرسل من الموقع هو طلب شراء، ويصبح مؤكَّدًا بعد اتصال المحل بك. يحق للمحل الاعتذار عن طلب لا يمكن تنفيذه، وسيبلغك بذلك.",en:"An order sent from the site is a purchase request; it is confirmed once the shop calls you. The shop may decline an order it cannot fulfil and will tell you if so."}]},{h:{ar:"الدفع",en:"Payment"},p:[{ar:"الدفع نقدًا عند الاستلام أو بتحويل CliQ إلى اسم CliQ الظاهر للمحل. في طلبات CliQ يبدأ تجهيز الطلب بعد وصول الحوالة.",en:"Payment is cash on delivery or a CliQ transfer to the shop’s alias shown on the site. For CliQ orders, preparation starts once the transfer arrives."}]},{h:{ar:"التوصيل",en:"Delivery"},p:[{ar:"يحدَّد موعد التوصيل النهائي بالاتفاق مع المحل عند التأكيد. يرجى التأكد من صحة العنوان ورقم المستلم.",en:"The final delivery time is agreed with the shop when confirming. Please make sure the address and the recipient’s number are correct."}]},{h:{ar:"الإلغاء والاستبدال",en:"Cancellation and exchanges"},p:[{ar:"لأن الورد يُجهَّز طازجًا عند الطلب، تُعالج طلبات الإلغاء أو أي مشكلة في الطلب بالتواصل المباشر مع المحل، وحسب ما يؤكّده المحل.",en:"Because flowers are prepared fresh to order, cancellations or any issue with an order are handled by contacting the shop directly, as t ث عن المحادثة","Sends to":"يرسل إلى","Send new orders to Telegram":"إرسال الطلبات الجديدة إلى تلغرام","Order number, items, total, payment, delivery day and area, and a link to the order. Phone numbers and addresses stay in the admin.":"رقم الطلب، الأصناف، الإجمالي، الدفع، يوم التوصيل والمنطقة، ورابط الطلب. الأرقام والعناوين تبقى في لوحة التحكم.","Test sent. Check that it arrived on the phone.":"أُرسلت التجربة. تأكّد أنها وصلت على الموبايل.","Send a test":"إرسال تجربة",Remove:"إزالة","Last message":"آخر رسالة","delivered to Telegram":"وصلت إلى تلغرام","Alerts are sent once, right after an order is saved. If Telegram is down, the order is still saved here, and the alert is not sent again.":"يُرسل التنبيه مرة واحدة بعد حفظ الطلب. إذا تعطّل تلغرام يبقى الطلب محفوظًا هنا، ولا يُعاد إرسال التنبيه.","Remove the Telegram connection? The saved token is deleted.":"إزالة ربط تلغرام؟ سيُحذف الرمز المحفوظ.","Removed ✓":"تمت الإزالة ✓","Extras show in the bag under “Add something extra”. Changes go live with Publish.":"تظهر الإضافات في السلة تحت «أضف لمسة على هديتك». التغييرات تُنشر بزر «نشر».","Add extra":"إضافة صنف","No extras yet.":"لا توجد إضافات بعد.","Every extra needs a name in both languages and a price above 0.":"كل إضافة تحتاج اسمًا باللغتين وسعرًا أكبر من صفر.","Remove photo":"حذف الصورة","A running occasion gets a section on the home page (the first one that’s on) and its own tab in the shop. Changes go live with Publish.":"المناسبة المفعّلة تظهر في الرئيسية (أول مناسبة مفعّلة) ولها تبويب في المتجر. التغييرات تُنشر بزر «نشر».","Running occasions show on the “What’s your occasion?” page, in the gift finder and in the shop filters, each with its own page. The season’s occasion also shows with the design types on the home page and in the shop. Changes go live with Publish.":"المناسبات المفعّلة تظهر في صفحة «ما مناسبتكم؟» وفي أداة اختيار الهدية وفلاتر المتجر، ولكل منها صفحتها. ومناسبة الموسم تظهر أيضًا مع أنواع التصاميم في الرئيسية والمتجر. التعديلات تظهر للزبائن بعد النشر.",Season:"الموسم",Icon:"الأيقونة","The season’s occasion":"مناسبة الموسم","Shows on the “What’s your occasion?” page, in the gift finder and in the shop filters. Switch it off when it’s out of season.":"تظهر في صفحة «ما مناسبتكم؟» وفي أداة اختيار الهدية وفلاتر المتجر. أوقفها إذا انتهى وقتها.","Also shows with the design types on the home page and in the shop (up to two on the home page).":"تظهر أيضًا مع أنواع التصاميم في الرئيسية والمتجر (حتى مناسبتين في الرئيسية).","Design types":"أنواع التصاميم","The design types show on the home page under “Choose your gift”, in the shop and in the footer. Add a type, change its name, short line or photo, or remove one that has no designs; the order here is the order on the site. Changes go live with Publish.":"تظهر أنواع التصاميم في الرئيسية تحت «اختر هديتك» وفي المتجر وأسفل الموقع. يمكنك إضافة نوع، أو تغيير اسمه أو سطره القصير أو صورته، أو حذف نوع ليس فيه تصاميم، وترتيبها هنا هو ترتيبها في الموقع. التعديلات تظهر للزبائن بعد النشر.","Add design type":"إضافة نوع",OK:"حسنًا","The shop needs at least one design type.":"يحتاج المتجر إلى نوع واحد على الأقل.","{name} still has {n} designs. Move them to another type first (Products → Edit → Category), then delete it.":"في «{name}» {n} تصاميم. انقلها أولًا إلى نوع آخر (التصاميم والأسعار ← تعديل ← الفئة)، ثم احذفه.","Every design type needs a name in both languages.":"يحتاج كل نوع إلى اسم بالعربية والإنجليزية.","A clear, bright photo looks best; the name sits on its lower part.":"الأفضل صورة واضحة ومضيئة؛ يظهر الاسم على جزئها السفلي.",Preview:"معاينة","Add occasion":"إضافة مناسبة","No occasions yet.":"لا توجد مناسبات بعد.","On the home page":"في الرئيسية",Running:"مفعّلة",Off:"متوقفة","{n} designs":"{n} تصاميم","Every occasion needs a name in both languages.":"كل مناسبة تحتاج اسمًا باللغتين.","Choose a photo.":"اختر صورة.","Or use a design’s photo:":"أو استخدم صورة تصميم:","Short line (Arabic)":"سطر قصير (عربي)","Short line (English)":"سطر قصير (إنجليزي)","Shows on the home page and i
