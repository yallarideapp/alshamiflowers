ays."}]},{h:{ar:"الدفع",en:"Payment"},p:[{ar:"الدفع نقدًا عند الاستلام أو بتحويل CliQ من تطبيق البنك. لا يطلب الموقع ولا يحفظ أي بيانات بطاقات أو حسابات بنكية.",en:"Payment is cash on delivery or a CliQ transfer from your banking app. The site never asks for or stores card or bank account details."}]},{h:{ar:"ملفات تعريف الارتباط والتخزين في المتصفح",en:"Cookies and browser storage"},p:[{ar:"نستخدم ملف تعريف ارتباط واحدًا ضروريًا لإبقائك مسجّل الدخول (عند استخدام الحساب). ويحفظ متصفحك محليًا: اللغة المختارة، محتوى السلة، والمفضّلة قبل تسجيل الدخول. لا نستخدم أدوات تتبّع أو تحليلات أو إعلانات.",en:"We use one essential cookie to keep you signed in (when you use an account). Your browser also keeps, locally: your chosen language, your bag, and favourites before you sign in. We use no tracking, analytics or advertising tools."}]},{h:{ar:"مع من نشارك البيانات",en:"Who we share data with"},p:[{ar:"لا نبيع بياناتك. تُعالج البيانات لدى:",en:"We never sell your data. It is processed by:"}],list:[{ar:"Cloudflare، الشركة التي تستضيف الموقع وقاعدة بياناته.",en:"Cloudflare, which hosts the site and its database."},{ar:"خدمة إرسال البريد التي تُبلغ المحل بالطلبات الجديدة وترسل روابط استعادة كلمة السر.",en:"The email service that notifies the shop of new orders and sends password-reset links."},{ar:"خطوط Google Fonts التي يحمّلها متصفحك من خوادم Google لعرض النصوص.",en:"Google Fonts, which your browser loads from Google’s servers to display text."},{ar:"فريق التوصيل، الذي يحصل على اسم المستلم ورقمه وعنوانه فقط.",en:"Our delivery team, who receive only the recipient’s name, mobile and address."}]},{h:{ar:"مدة الاحتفاظ",en:"How long we keep it"},p:[{ar:"نحتفظ بالطلبات للمدة اللازمة لتنفيذها ولمتطلبات المحاسبة. يمكنك حذف حسابك بطلب منّا، وعندها تُفصل طلباتك السابقة عنه.",en:"We keep orders for as long as needed to fulfil them and for accounting. You can ask us to delete your account; your past orders are then unlinked from it."}]},{h:{ar:"حقوقك",en:"Your rights"},p:[{ar:"يحق لك الاط
